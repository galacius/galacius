name: Setup Go
description: Install Go from go.mod with optional cache

inputs:
  cache:
    description: Enable Go module cache
    required: false
    default: "true"
  go-version-file:
    description: Path to the go.mod file to read the Go version from
    required: false
    default: "go.mod"

runs:
  using: composite
  steps:
    - name: Setup Go from go.mod
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    - name: Get Go module cache dir
      if: inputs.cache == 'true'
      id: go-mod-cache
      shell: bash
      run: echo "dir=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.go-mod-cache.outputs.dir }}
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-
